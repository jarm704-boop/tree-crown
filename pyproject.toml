[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "treecrown-nz-jarm704"
version = "0.1.0"
description = "Tree canopy coverage and walking shade tools for Wellington, New Zealand."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Joshua Armstrong" }
]
dependencies = [
    "geopandas>=0.14.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "shapely>=2.0.0",
    "matplotlib>=3.7.0",
    "osmnx>=1.9.0",
    "networkx>=3.4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/treecrown_nz"]

[tool.hatch.build.targets.sdist]
include = [
    "src/treecrown_nz/**",
    "README.md",
    "LICENSE"
]

